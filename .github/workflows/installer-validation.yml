name: Installer validation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'installers/**'
      - 'LICENSES/**'
      - 'THIRD_PARTY.md'
      - 'docs/provenance-review.md'
      - 'tests/**'
      - 'backend/**'
      - 'shim/**'
      - 'tools/**'
      - 'macos/build-*.sh'
      - 'macos/driver-registration.cpp'
      - '.github/workflows/installer-validation.yml'
concurrency:
  group: installer-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Audit committed release source
        run: |
          python3 tests/test_source_audit.py
          python3 tests/test_mac_distribution.py
          python3 tools/audit-source.py
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          audio=libasound2
          tls=libgnutls30
          if apt-cache show libasound2t64 >/dev/null 2>&1; then audio=libasound2t64; fi
          if apt-cache show libgnutls30t64 >/dev/null 2>&1; then tls=libgnutls30t64; fi
          sudo apt-get install -y clang lld llvm bison flex make patch pkg-config libmnl-dev nftables python3-tk xvfb xauth curl ca-certificates libfreetype6 "$audio" "$tls" libx11-6 libxext6 libxrender1 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libgl1 libvulkan1 fontconfig fonts-liberation libdbus-1-3 libudev1
      - name: Check installer security and lifecycle
        run: python3 tests/test_installer.py
      - name: Build the native Linux backend
        run: make -C backend
      - name: Restore source-matched Windows payloads
        id: payload-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            installers/payloads
            build/installer/exitlag-bridge-wine-source.tar.gz
          key: windows-payload-v1-${{ matrix.os }}-${{ hashFiles('installers/build_runtime.py', 'installers/bridge_setup/catalog.json', 'macos/build-*.sh', 'macos/companion.cpp', 'macos/driver-registration.cpp', 'shim/**', 'wine-wbemprox/patches/**') }}
      - name: Build pinned Windows compatibility payloads
        if: steps.payload-cache.outputs.cache-hit != 'true'
        run: python3 installers/build_runtime.py payloads --output installers/payloads
      - name: Save source-matched payloads after a successful build
        if: steps.payload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            installers/payloads
            build/installer/exitlag-bridge-wine-source.tar.gz
          key: ${{ steps.payload-cache.outputs.cache-primary-key }}
      - name: Validate an actual fresh Wine runtime and WMI
        run: xvfb-run -a python3 tests/installer_fresh_runtime.py installers/payloads
      - name: Run account-free Linux unit checks
        run: PATH="$PWD/build/installer/bin:/usr/lib/llvm-14/bin:/usr/lib/llvm-18/bin:/usr/bin:/bin:$PATH" tests/run-all.sh unit
      - name: Check desktop and privileged-supervisor behavior
        run: /usr/bin/python3 tests/test_linux_desktop.py
      - name: Build Linux release packages
        run: python3 installers/linux/build.py --output build/releases
      - name: Install the Debian package and exercise first-run UI
        run: |
          sudo apt-get install -y ./build/releases/exitlag-bridge_0.4.0_amd64.deb
          xvfb-run -a /usr/bin/python3 tests/test_desktop_ui.py /usr/lib/exitlag-bridge
      - name: Verify installed routing lifecycle in an isolated network namespace
        run: |
          sudo modprobe nfnetlink_queue
          sudo unshare --net runuser -u "$USER" -- /usr/bin/python3 tests/test_installed_routing.py /usr/lib/exitlag-bridge
      - name: Upload only distributable build artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.os }}
          path: |
            build/releases/*
            build/installer/exitlag-bridge-wine-source.tar.gz
          if-no-files-found: error
          retention-days: 7
